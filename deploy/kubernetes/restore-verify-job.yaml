apiVersion: v1
kind: ServiceAccount
metadata:
  name: banking-reconciliation-restore-verify
  namespace: banking-reconciliation
automountServiceAccountToken: true
---
apiVersion: batch/v1
kind: Job
metadata:
  name: banking-reconciliation-restore-verify-__VERSION__
  namespace: banking-reconciliation
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: banking-reconciliation
        app.kubernetes.io/component: database-restore-verification
    spec:
      restartPolicy: Never
      serviceAccountName: banking-reconciliation-restore-verify
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: restore-verify
          image: __BACKUP_IMAGE__
          command: ["/usr/local/bin/restore-verify.sh"]
          env:
            - name: PGHOST
              valueFrom:
                secretKeyRef:
                  name: banking-reconciliation-restore-verify-secrets
                  key: host
            - name: PGPORT
              value: "5432"
            - name: PGSSLMODE
              value: verify-full
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: banking-reconciliation-restore-verify-secrets
                  key: username
            - name: PGPASSFILE
              value: /secrets/pgpass
            - name: BACKUP_OBJECT_URI
              value: __BACKUP_OBJECT_URI__
            - name: VERIFY_DATABASE
              value: banking_reconciliation_restore_verify
          volumeMounts:
            - name: credentials
              mountPath: /secrets
              readOnly: true
            - name: temporary
              mountPath: /tmp
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: credentials
          secret:
            secretName: banking-reconciliation-restore-verify-secrets
            defaultMode: 0400
            items:
              - key: pgpass
                path: pgpass
        - name: temporary
          emptyDir:
            sizeLimit: 2Gi
