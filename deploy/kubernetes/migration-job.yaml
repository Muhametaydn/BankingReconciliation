apiVersion: batch/v1
kind: Job
metadata:
  name: banking-reconciliation-migrate-__VERSION__
  namespace: banking-reconciliation
  labels:
    app.kubernetes.io/name: banking-reconciliation
    app.kubernetes.io/component: database-migration
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: banking-reconciliation
        app.kubernetes.io/component: database-migration
    spec:
      restartPolicy: Never
      serviceAccountName: banking-reconciliation
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: __IMAGE__
          args: ["--migrate-only"]
          envFrom:
            - configMapRef:
                name: banking-reconciliation-config
          env:
            - name: ConnectionStrings__ReconciliationDatabase
              valueFrom:
                secretKeyRef:
                  name: banking-reconciliation-secrets
                  key: reconciliation-migration-database
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: temporary
              mountPath: /tmp
      volumes:
        - name: temporary
          emptyDir:
            sizeLimit: 64Mi
