apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: banking-reconciliation-default-deny
  namespace: banking-reconciliation
spec:
  podSelector: {}
  policyTypes: ["Ingress", "Egress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: banking-reconciliation-allow-required
  namespace: banking-reconciliation
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: banking-reconciliation
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 4317
        - protocol: TCP
          port: 5432
