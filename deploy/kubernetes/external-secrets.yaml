apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: banking-reconciliation
  namespace: banking-reconciliation
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: __EXTERNAL_SECRET_STORE__
  target:
    name: banking-reconciliation-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: reconciliation-database
      remoteRef:
        key: __APPLICATION_SECRET_ID__
        property: reconciliation-database
    - secretKey: reconciliation-migration-database
      remoteRef:
        key: __APPLICATION_SECRET_ID__
        property: reconciliation-migration-database
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: banking-reconciliation-backup
  namespace: banking-reconciliation
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: __EXTERNAL_SECRET_STORE__
  target:
    name: banking-reconciliation-backup-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: host
      remoteRef:
        key: __BACKUP_SECRET_ID__
        property: host
    - secretKey: username
      remoteRef:
        key: __BACKUP_SECRET_ID__
        property: username
    - secretKey: pgpass
      remoteRef:
        key: __BACKUP_SECRET_ID__
        property: pgpass
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: banking-reconciliation-restore-verify
  namespace: banking-reconciliation
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: __EXTERNAL_SECRET_STORE__
  target:
    name: banking-reconciliation-restore-verify-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: host
      remoteRef:
        key: __RESTORE_SECRET_ID__
        property: host
    - secretKey: username
      remoteRef:
        key: __RESTORE_SECRET_ID__
        property: username
    - secretKey: pgpass
      remoteRef:
        key: __RESTORE_SECRET_ID__
        property: pgpass
