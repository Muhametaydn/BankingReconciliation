apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: banking-reconciliation
  namespace: banking-reconciliation
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: banking-reconciliation
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: banking-reconciliation
  namespace: banking-reconciliation
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: banking-reconciliation
  minReplicas: 2
  maxReplicas: 8
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
