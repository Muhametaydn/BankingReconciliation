apiVersion: apps/v1
kind: Deployment
metadata:
  name: banking-reconciliation
  namespace: banking-reconciliation
  labels:
    app.kubernetes.io/name: banking-reconciliation
    app.kubernetes.io/version: __VERSION__
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: banking-reconciliation
  template:
    metadata:
      labels:
        app.kubernetes.io/name: banking-reconciliation
        app.kubernetes.io/version: __VERSION__
    spec:
      serviceAccountName: banking-reconciliation
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: __IMAGE__
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: banking-reconciliation-config
          env:
            - name: ConnectionStrings__ReconciliationDatabase
              valueFrom:
                secretKeyRef:
                  name: banking-reconciliation-secrets
                  key: reconciliation-database
            - name: ConnectionStrings__BranchSourceDatabase
              valueFrom:
                secretKeyRef:
                  name: banking-reconciliation-secrets
                  key: branch-source-database
                  optional: true
            - name: ConnectionStrings__BankSourceDatabase
              valueFrom:
                secretKeyRef:
                  name: banking-reconciliation-secrets
                  key: bank-source-database
                  optional: true
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /api/health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 6
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 5
            failureThreshold: 24
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: temporary
              mountPath: /tmp
      volumes:
        - name: temporary
          emptyDir:
            sizeLimit: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: banking-reconciliation
  namespace: banking-reconciliation
spec:
  selector:
    app.kubernetes.io/name: banking-reconciliation
  ports:
    - name: http
      port: 80
      targetPort: http
  type: ClusterIP
