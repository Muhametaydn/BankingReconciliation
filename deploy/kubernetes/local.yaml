apiVersion: v1
kind: Namespace
metadata:
  name: banking-reconciliation-local
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: banking-reconciliation-local-data
  namespace: banking-reconciliation-local
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: banking-reconciliation-local
  namespace: banking-reconciliation-local
  labels:
    app.kubernetes.io/name: banking-reconciliation-local
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: banking-reconciliation-local
  template:
    metadata:
      labels:
        app.kubernetes.io/name: banking-reconciliation-local
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654
        runAsGroup: 1654
        fsGroup: 1654
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: __LOCAL_IMAGE__
          imagePullPolicy: Never
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Development
            - name: ConnectionStrings__ReconciliationDatabase
              value: ""
            - name: Authentication__Authority
              value: ""
            - name: Authentication__LocalSigningKey
              value: __LOCAL_SIGNING_KEY__
            - name: Authentication__LocalUserStorePath
              value: /data/users.json
            - name: ReconciliationUpload__TemporaryStorageMode
              value: Local
            - name: ReconciliationUpload__TemporaryStoragePath
              value: /data/uploads
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /api/health/ready
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /data
            - name: temp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: banking-reconciliation-local-data
        - name: temp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: banking-reconciliation-local
  namespace: banking-reconciliation-local
spec:
  selector:
    app.kubernetes.io/name: banking-reconciliation-local
  ports:
    - name: http
      port: 8080
      targetPort: http
