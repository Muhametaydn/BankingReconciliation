apiVersion: v1
kind: ServiceAccount
metadata:
  name: banking-reconciliation-backup
  namespace: banking-reconciliation
automountServiceAccountToken: true
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: banking-reconciliation-backup
  namespace: banking-reconciliation
spec:
  schedule: "0 */6 * * *"
  timeZone: "Etc/UTC"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: banking-reconciliation
            app.kubernetes.io/component: database-backup
        spec:
          restartPolicy: Never
          serviceAccountName: banking-reconciliation-backup
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: backup
              image: __BACKUP_IMAGE__
              command: ["/usr/local/bin/backup.sh"]
              env:
                - name: PGHOST
                  valueFrom:
                    secretKeyRef:
                      name: banking-reconciliation-backup-secrets
                      key: host
                - name: PGPORT
                  value: "5432"
                - name: PGDATABASE
                  value: banking_reconciliation
                - name: PGSSLMODE
                  value: verify-full
                - name: PGUSER
                  valueFrom:
                    secretKeyRef:
                      name: banking-reconciliation-backup-secrets
                      key: username
                - name: PGPASSFILE
                  value: /secrets/pgpass
                - name: BACKUP_S3_URI
                  value: s3://__BACKUP_BUCKET__/banking-reconciliation/postgres
                - name: BACKUP_KMS_KEY_ID
                  value: __BACKUP_KMS_KEY_ID__
              volumeMounts:
                - name: credentials
                  mountPath: /secrets
                  readOnly: true
                - name: temporary
                  mountPath: /tmp
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  cpu: "1"
                  memory: 1Gi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
          volumes:
            - name: credentials
              secret:
                secretName: banking-reconciliation-backup-secrets
                defaultMode: 0400
                items:
                  - key: pgpass
                    path: pgpass
            - name: temporary
              emptyDir:
                sizeLimit: 2Gi
