name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore BankingReconciliation.sln

      - name: Verify formatting
        run: dotnet format BankingReconciliation.sln --verify-no-changes --no-restore

      - name: Build
        run: dotnet build BankingReconciliation.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test BankingReconciliation.sln --configuration Release --no-build --no-restore
