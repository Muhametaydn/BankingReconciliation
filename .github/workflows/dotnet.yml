name: dotnet

permissions:
  contents: read
  id-token: write

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    env:
      MINIO_IMAGE: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z@sha256:a1ea29fa28355559ef137d71fc570e508a214ec84ff8083e39bc5428980b015e
      MINIO_MC_IMAGE: quay.io/minio/mc:RELEASE.2025-04-16T18-13-26Z@sha256:aead63c77f9db9107f1696fb08ecb0faeda23729cde94b0f663edf4fe09728e3
      MINIO_ROOT_USER: minio-root
      MINIO_ROOT_PASSWORD: minio-root-password
      MINIO_APP_USER: reconciliation-ci
      MINIO_APP_PASSWORD: reconciliation-ci-password
      MINIO_BUCKET: banking-reconciliation-ci
      MINIO_PREFIX: banking-reconciliation/integration
      MINIO_AUDIT_BUCKET: banking-reconciliation-audit-ci
      MINIO_AUDIT_PREFIX: banking-reconciliation/audit-archive
      MINIO_AUDIT_SIGNING_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      AWS_WORM_ROLE_ARN: ${{ secrets.AWS_WORM_ROLE_ARN }}
      AWS_WORM_BUCKET: ${{ secrets.AWS_WORM_BUCKET }}
      AWS_WORM_REGION: ${{ secrets.AWS_WORM_REGION }}
      AWS_WORM_EXPECTED_OWNER: ${{ secrets.AWS_WORM_EXPECTED_OWNER }}
      AWS_WORM_KMS_KEY_ID: ${{ secrets.AWS_WORM_KMS_KEY_ID }}

    services:
      postgres:
        image: postgres:16@sha256:95206741a5b214807675e14165369d05b93a9cf692223b616d07cca227e74b0b
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: root
          POSTGRES_DB: banking_reconciliation_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d banking_reconciliation_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.x

      - name: Start MinIO
        run: |
          docker run --detach \
            --name banking-reconciliation-minio \
            --publish 9000:9000 \
            --env MINIO_ROOT_USER \
            --env MINIO_ROOT_PASSWORD \
            "$MINIO_IMAGE" server /data

          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:9000/minio/health/ready > /dev/null; then
              exit 0
            fi
            sleep 1
          done

          docker logs banking-reconciliation-minio
          exit 1

      - name: Configure least-privilege MinIO access
        run: |
          mkdir -p "$RUNNER_TEMP/minio-mc" "$RUNNER_TEMP/minio-policy"
          sed \
            -e "s/\${BUCKET}/$MINIO_BUCKET/g" \
            -e "s#\${PREFIX}#$MINIO_PREFIX#g" \
            deploy/minio/reconciliation-policy.template.json \
            > "$RUNNER_TEMP/minio-policy/reconciliation-policy.json"
          sed \
            -e "s/\${BUCKET}/$MINIO_AUDIT_BUCKET/g" \
            -e "s#\${PREFIX}#$MINIO_AUDIT_PREFIX#g" \
            deploy/minio/audit-archive-policy.template.json \
            > "$RUNNER_TEMP/minio-policy/audit-archive-policy.json"

          mc() {
            docker run --rm --network host \
              --volume "$RUNNER_TEMP/minio-mc:/root/.mc" \
              --volume "$RUNNER_TEMP/minio-policy:/policy:ro" \
              "$MINIO_MC_IMAGE" "$@"
          }

          mc alias set local http://127.0.0.1:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"
          mc mb "local/$MINIO_BUCKET"
          mc mb --with-lock "local/$MINIO_AUDIT_BUCKET"
          mc retention set --default COMPLIANCE 3650d "local/$MINIO_AUDIT_BUCKET"
          mc admin user add local "$MINIO_APP_USER" "$MINIO_APP_PASSWORD"
          mc admin policy create local banking-reconciliation-ci /policy/reconciliation-policy.json
          mc admin policy create local banking-reconciliation-audit-ci /policy/audit-archive-policy.json
          mc admin policy attach local banking-reconciliation-ci --user "$MINIO_APP_USER"
          mc admin policy attach local banking-reconciliation-audit-ci --user "$MINIO_APP_USER"

      - name: Restore
        run: dotnet restore ./BankingReconciliation.sln

      - name: Build
        run: dotnet build ./BankingReconciliation.sln --configuration Release --no-restore

      - name: Test
        env:
          BANKING_RECONCILIATION_POSTGRES_TEST_CONNECTION: Host=localhost;Port=5432;Database=banking_reconciliation_test;Username=postgres;Password=root
          BANKING_RECONCILIATION_S3_TEST_REQUIRED: "true"
          BANKING_RECONCILIATION_S3_TEST_ENFORCE_LEAST_PRIVILEGE: "true"
          BANKING_RECONCILIATION_S3_TEST_BUCKET: ${{ env.MINIO_BUCKET }}
          BANKING_RECONCILIATION_S3_TEST_PREFIX: ${{ env.MINIO_PREFIX }}
          BANKING_RECONCILIATION_S3_TEST_SERVICE_URL: http://127.0.0.1:9000
          BANKING_RECONCILIATION_S3_TEST_REGION: us-east-1
          BANKING_RECONCILIATION_IMMUTABLE_AUDIT_TEST_REQUIRED: "true"
          BANKING_RECONCILIATION_IMMUTABLE_AUDIT_TEST_BUCKET: ${{ env.MINIO_AUDIT_BUCKET }}
          BANKING_RECONCILIATION_IMMUTABLE_AUDIT_TEST_PREFIX: ${{ env.MINIO_AUDIT_PREFIX }}
          BANKING_RECONCILIATION_IMMUTABLE_AUDIT_TEST_SERVICE_URL: http://127.0.0.1:9000
          BANKING_RECONCILIATION_IMMUTABLE_AUDIT_TEST_REGION: us-east-1
          BANKING_RECONCILIATION_IMMUTABLE_AUDIT_TEST_SIGNING_KEY: ${{ env.MINIO_AUDIT_SIGNING_KEY }}
          AWS_ACCESS_KEY_ID: ${{ env.MINIO_APP_USER }}
          AWS_SECRET_ACCESS_KEY: ${{ env.MINIO_APP_PASSWORD }}
        run: dotnet test ./BankingReconciliation.sln --configuration Release --no-build

      - name: Configure AWS WORM test identity (optional)
        if: ${{ env.AWS_WORM_ROLE_ARN != '' && env.AWS_WORM_REGION != '' }}
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ env.AWS_WORM_ROLE_ARN }}
          aws-region: ${{ env.AWS_WORM_REGION }}

      - name: AWS KMS and Object Lock integration (optional)
        env:
          BANKING_RECONCILIATION_AWS_WORM_TEST_REQUIRED: "true"
          BANKING_RECONCILIATION_AWS_WORM_TEST_BUCKET: ${{ env.AWS_WORM_BUCKET }}
          BANKING_RECONCILIATION_AWS_WORM_TEST_PREFIX: banking-reconciliation/audit-integration
          BANKING_RECONCILIATION_AWS_WORM_TEST_REGION: ${{ env.AWS_WORM_REGION }}
          BANKING_RECONCILIATION_AWS_WORM_TEST_EXPECTED_OWNER: ${{ env.AWS_WORM_EXPECTED_OWNER }}
          BANKING_RECONCILIATION_AWS_WORM_TEST_KMS_KEY_ID: ${{ env.AWS_WORM_KMS_KEY_ID }}
          BANKING_RECONCILIATION_AWS_WORM_TEST_RETENTION_DAYS: "1"
        run: |
          if [ -z "$AWS_WORM_ROLE_ARN$AWS_WORM_REGION$BANKING_RECONCILIATION_AWS_WORM_TEST_BUCKET$BANKING_RECONCILIATION_AWS_WORM_TEST_EXPECTED_OWNER$BANKING_RECONCILIATION_AWS_WORM_TEST_KMS_KEY_ID" ]; then
            if [ -z "$AWS_WORM_ROLE_ARN" ] && \
               [ -z "$AWS_WORM_REGION" ] && \
               [ -z "$BANKING_RECONCILIATION_AWS_WORM_TEST_BUCKET" ] && \
               [ -z "$BANKING_RECONCILIATION_AWS_WORM_TEST_EXPECTED_OWNER" ] && \
               [ -z "$BANKING_RECONCILIATION_AWS_WORM_TEST_KMS_KEY_ID" ]; then
              echo "AWS WORM integration secrets are not configured; optional profile skipped."
              exit 0
            fi
            echo "AWS WORM integration secrets are only partially configured."
            exit 1
          fi

          dotnet test ./BankingReconciliation.Tests/BankingReconciliation.Tests.csproj \
            --configuration Release \
            --no-build \
            --filter FullyQualifiedName~AwsKmsS3ImmutableAuditArchiveIntegrationTests

  production-verification:
    runs-on: ubuntu-latest
    env:
      K6_IMAGE: grafana/k6:1.7.1@sha256:4fd3a694926b064d3491d9b02b01cde886583c4931f1223816e3d9a7bdfa7e0f
      ZAP_IMAGE: ghcr.io/zaproxy/zaproxy:stable@sha256:781a2bdaea47324e7bab583e2263f21d257b0aee61ed51521a5be45f5f5081ef
      TRIVY_IMAGE: aquasec/trivy:0.72.0@sha256:cffe3f5161a47a6823fbd23d985795b3ed72a4c806da4c4df16266c02accdd6f
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.x

      - name: Restore and build
        run: |
          dotnet restore ./BankingReconciliation.sln
          dotnet build ./BankingReconciliation.sln --configuration Release --no-restore

      - name: Reject vulnerable NuGet dependencies
        run: |
          dotnet list ./BankingReconciliation.sln package \
            --vulnerable --include-transitive --format json > vulnerabilities.json
          python3 - <<'PY'
          import json
          import sys

          with open("vulnerabilities.json", encoding="utf-8") as handle:
              report = json.load(handle)

          findings = []
          def inspect(value, path="root"):
              if isinstance(value, dict):
                  vulnerabilities = value.get("vulnerabilities")
                  if isinstance(vulnerabilities, list) and vulnerabilities:
                      findings.append(path)
                  for key, child in value.items():
                      inspect(child, f"{path}.{key}")
              elif isinstance(value, list):
                  for index, child in enumerate(value):
                      inspect(child, f"{path}[{index}]")

          inspect(report)
          if findings:
              print("Vulnerable NuGet packages detected at:", *findings, sep="\n- ")
              sys.exit(1)
          print("No vulnerable NuGet dependencies detected.")
          PY

      - name: Build production containers
        run: |
          docker build --tag banking-reconciliation:ci .
          docker build \
            --file ./deploy/postgres/Dockerfile \
            --tag banking-reconciliation-postgres-ops:ci \
            ./deploy/postgres

      - name: Scan deployment configuration and images
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/workspace:ro" \
            "$TRIVY_IMAGE" config \
            --exit-code 1 --severity HIGH,CRITICAL \
            /workspace/deploy/kubernetes
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/workspace:ro" \
            "$TRIVY_IMAGE" config \
            --exit-code 1 --severity HIGH,CRITICAL \
            /workspace/Dockerfile
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/workspace:ro" \
            "$TRIVY_IMAGE" config \
            --exit-code 1 --severity HIGH,CRITICAL \
            /workspace/deploy/postgres/Dockerfile
          docker run --rm \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            "$TRIVY_IMAGE" image \
            --exit-code 1 --severity HIGH,CRITICAL \
            banking-reconciliation:ci
          docker run --rm \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            "$TRIVY_IMAGE" image \
            --exit-code 1 --severity HIGH,CRITICAL \
            banking-reconciliation-postgres-ops:ci

      - name: Start isolated test application
        run: |
          ASPNETCORE_ENVIRONMENT=Testing \
          dotnet run \
            --project ./BankingReconciliation.Api/BankingReconciliation.Api.csproj \
            --configuration Release \
            --no-build \
            --no-launch-profile \
            --urls http://127.0.0.1:5097 > "$RUNNER_TEMP/production-verification-app.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/production-verification-app.pid"

          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:5097/api/health > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/production-verification-app.log"
          exit 1

      - name: Load acceptance
        run: |
          docker run --rm --network host \
            --volume "$GITHUB_WORKSPACE/tests/load:/scripts:ro" \
            --env BASE_URL=http://127.0.0.1:5097 \
            "$K6_IMAGE" run /scripts/reconciliation.js

      - name: Passive security baseline
        run: |
          mkdir -p "$RUNNER_TEMP/zap-wrk"
          docker run --rm --network host \
            --volume "$GITHUB_WORKSPACE/tests/security:/zap/rules:ro" \
            --volume "$RUNNER_TEMP/zap-wrk:/zap/wrk:rw" \
            "$ZAP_IMAGE" zap-baseline.py \
            -t http://127.0.0.1:5097 \
            -c /zap/rules/zap.conf \
            -I -s -T 5

      - name: Upload verification logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-verification-logs
          path: ${{ runner.temp }}/production-verification-app.log
          if-no-files-found: ignore

      - name: Stop isolated test application
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/production-verification-app.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/production-verification-app.pid")" || true
          fi
